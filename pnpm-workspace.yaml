packages:
  - "packages/*"

# pnpm 11 replaced onlyBuiltDependencies / neverBuiltDependencies / ignoredBuiltDependencies with one allowBuilds map
# (name: true/false). Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  protobufjs: true

# pnpm 11 no longer reads the "pnpm" field in package.json, so overrides live here.
overrides:
  qs: ">=6.16.0"
  fast-uri: ">=3.1.6"
  proxy-addr: ">=2.0.8"
  body-parser: ">=2.4.0"
  zod: ">=4.6.6"
  "brace-expansion@>=4.0.0 <5.0.11": ">=5.0.11"

# One place for every dependency version that more than one package uses. Packages write "catalog:" instead of a
# number, so an upgrade is one line here and two packages can never drift apart. `pnpm pack` / `pnpm publish` replace
# "catalog:" with the real range, so published package.json files contain normal versions.
catalog:
  "@modelcontextprotocol/sdk": ^1.31.0
  "@types/node": 22.13.0
  cross-spawn: ^7.0.6
  expect: ^29.7.0
  ts-morph: ^28.0.0
  tsx: ^4.19.2
  typescript: 5.7.2
  zod: ^4.6.6

# Audit exceptions. Each needs a reason and a date to look at it again; remove it as soon as a fixed release exists.
# GHSA-fc5q-39xc-vjpf (CVE-2026-33671, picomatch <= 4.0.7, ReDoS from attacker-supplied extglob patterns such as +(*)).
# Checked 2026-11-18: 4.0.7 is the newest picomatch, so no fixed version exists to upgrade to. The only production path is
# ts-morph > @ts-morph/common > tinyglobby > picomatch, and Purix only calls ts-morph on an in-memory file system
# (createSourceFile on a string in verify/test_integrity.ts and verify/ast_transforms.ts): no glob pattern from any input reaches it.
# Review again by 2026-12-18, or when picomatch publishes a release after 4.0.7.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
