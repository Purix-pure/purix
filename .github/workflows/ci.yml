name: Purix CI & Gate-Parity Certification

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Boundary Check
        run: pnpm run boundary-check
      - name: Run Artifact Check
        run: pnpm run artifact-check
      - name: Run Typecheck
        run: pnpm run typecheck
      - name: Run Test Suite
        run: pnpm run test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Gate-Parity Conformance Suite
        run: pnpm exec tsx packages/core/src/language/conformance/run.ts
      - name: Upload Parity Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-parity-report
          path: language-parity-report.json
