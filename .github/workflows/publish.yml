name: Publish to npm

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses npm's OIDC "trusted publishing" — no NPM_TOKEN secret stored anywhere.
# GitHub Actions exchanges a short-lived OIDC token for a one-shot publish
# credential at run time. This requires a ONE-TIME manual step per package
# before it works the first time: npm can only enable trusted publishing for
# a package that already exists on the registry (see
# https://docs.npmjs.com/trusted-publishers). Until each of @purix/core,
# @purix/mcp-server, and @purix/cli has been published at least once by hand and
# had trusted publishing turned on for it in that package's Settings >
# Publishing access page (pointing at this repo + this workflow file), this
# job will fail with an auth error — that's expected, not a bug in this file.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup only supports pnpm v10 and older — see the same
      # note in ci.yml. Using it here would break the release pipeline
      # specifically, which is the one workflow with zero room for a silent
      # failure (it publishes to the real npm registry on a tag push).
      - uses: pnpm/setup@v1
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # REAL FIX (2026-09-19): actions/setup-node@v4's registry-url option
      # always writes "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
      # into .npmrc, regardless of whether NODE_AUTH_TOKEN is set. This
      # workflow deliberately never sets that secret (trusted publishing
      # replaces it), so it expands to an empty string — and npm reads the
      # mere presence of that line as "auth is already configured" and
      # skips the OIDC exchange entirely, failing with ENEEDAUTH or a 404
      # even though everything else here is correctly set up. Stripping
      # the line is the documented fix; see
      # PURIX-CODE-VERIFIED-GAP-REPORT-2026-09-19.md §3 for the trace.
      - name: Remove empty auth token line left by setup-node
        run: sed -i '/_authToken=$/d' .npmrc || true

      # Trusted publishing needs npm CLI 11.5.1+. Pin explicitly rather
      # than trust whatever version ships with the Node 22.13.0 image above
      # — that pairing isn't guaranteed to include a new-enough npm, and
      # this is exactly the kind of thing that should fail loudly in CI,
      # not silently downgrade to a token-based auth attempt that doesn't
      # exist anymore.
      - name: Ensure npm CLI is new enough for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Never publish anything that hasn't passed the same gates CI checks
      # on every PR. A tag push skips normal PR review, so this is the one
      # thing standing between "someone pushed a bad tag" and a broken
      # release reaching real users.
      - name: Boundary check
        run: pnpm run boundary-check
      - name: Artifact check
        run: pnpm run artifact-check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test

      # Same two gates ci.yml enforces (the coverage threshold job and the language
      # conformance job). A tag push skips PR review, so publishing must not be able to
      # succeed while either of them would fail on a pull request.
      - name: Coverage gate
        run: pnpm run coverage
      - name: Language conformance suite
        run: pnpm exec tsx packages/core/src/language/conformance/run.ts

      # A prerelease (0.2.0-beta.0) must never take npm's default "latest" tag: pnpm/npm
      # publish to "latest" unless told otherwise, so `npm install @purix/cli` would hand
      # everyone the beta. Derive the tag from the version: 0.2.0-beta.0 -> beta,
      # 0.3.0-rc.1 -> rc, an unrecognised prerelease -> next, a stable version -> latest.
      - name: Compute npm dist-tag
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          case "$VERSION" in
            *-*)
              TAG=$(echo "$VERSION" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/')
              case "$TAG" in
                *[!A-Za-z]*|"") TAG=next ;;
              esac
              ;;
            *) TAG=latest ;;
          esac
          echo "Publishing $VERSION under dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # All three packages currently move in lockstep at the same version
      # (see each package.json). Fail loudly rather than publish a package
      # whose package.json version doesn't match the git tag that triggered
      # this — that mismatch means someone forgot to bump a version file, or
      # tagged the wrong commit, and either way this should stop, not guess.
      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/mcp-server packages/cli; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match $pkg/package.json version $PKG_VERSION"
              exit 1
            fi
          done

      # Publish order matters: @purix/core has no internal dependency on the
      # others, @purix/mcp-server depends on @purix/core, and @purix/cli
      # depends on both. Each publish makes the next one resolvable —
      # publishing cli before core/mcp-server are live on the registry would
      # leave its declared workspace-protocol ranges unsatisfiable for
      # anyone installing at that moment (pnpm rewrites workspace: ranges to
      # the matching real semver range at publish time).
      - name: Publish @purix/core
        run: pnpm --filter @purix/core publish --access public --provenance --no-git-checks --tag "${{ steps.dist_tag.outputs.tag }}"

      - name: Publish @purix/mcp-server
        run: pnpm --filter @purix/mcp-server publish --access public --provenance --no-git-checks --tag "${{ steps.dist_tag.outputs.tag }}"

      - name: Publish @purix/cli
        run: pnpm --filter @purix/cli publish --access public --provenance --no-git-checks --tag "${{ steps.dist_tag.outputs.tag }}"