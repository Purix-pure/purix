name: Publish to npm

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses npm's OIDC "trusted publishing" — no NPM_TOKEN secret stored anywhere.
# GitHub Actions exchanges a short-lived OIDC token for a one-shot publish
# credential at run time. This requires a ONE-TIME manual step per package
# before it works the first time: npm can only enable trusted publishing for
# a package that already exists on the registry (see
# https://docs.npmjs.com/trusted-publishers). Until each of @purix/core,
# @purix/mcp-server, and @purix/cli has been published at least once by hand and
# had trusted publishing turned on for it in that package's Settings >
# Publishing access page (pointing at this repo + this workflow file), this
# job will fail with an auth error — that's expected, not a bug in this file.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, typed exactly as in package.json (e.g. 0.4.0-beta.1). Must match all three packages. Run from main. Leave empty for the OIDC debug run.'
        required: false
        type: string
      debug_oidc_only:
        description: 'Debug only: print the GitHub identity claims and test npm token exchange for the 3 packages. Publishes nothing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    if: ${{ !inputs.debug_oidc_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/action-setup only supports pnpm v10 and older — see the same
      # note in ci.yml. Using it here would break the release pipeline
      # specifically, which is the one workflow with zero room for a silent
      # failure (it publishes to the real npm registry on a tag push).
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          version: 12.4.1
          # pnpm/setup would otherwise run its own `pnpm install` here, before setup-node, on the runner's default Node. The next steps install explicitly.
          install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # setup-node's registry-url option writes a user-level .npmrc (in $RUNNER_TEMP, not
      # the repo) containing "_authToken=${NODE_AUTH_TOKEN}" and "always-auth=true", and
      # exports a placeholder NODE_AUTH_TOKEN. With trusted publishing there is no token,
      # so that config only gets in the way. npm already defaults to registry.npmjs.org,
      # so registry-url is omitted above and this step fails the job if a token sneaks in.
      - name: Assert no static npm token is configured
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then echo "::error::NODE_AUTH_TOKEN is set; trusted publishing must not use a token"; exit 1; fi
          if npm config list 2>/dev/null | grep -qi '_authToken'; then echo "::error::an _authToken is configured in npm config"; exit 1; fi

      # Trusted publishing needs npm CLI 11.5.1+. Pin explicitly rather
      # than trust whatever version ships with the Node version installed above
      # — that pairing isn't guaranteed to include a new-enough npm, and
      # this is exactly the kind of thing that should fail loudly in CI,
      # not silently downgrade to a token-based auth attempt that doesn't
      # exist anymore.
      - name: Ensure npm CLI is new enough for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Never publish anything that hasn't passed the same gates CI checks
      # on every PR. A tag push skips normal PR review, so this is the one
      # thing standing between "someone pushed a bad tag" and a broken
      # release reaching real users.
      - name: Boundary check
        run: pnpm run boundary-check
      - name: Single-point check
        run: pnpm run single-point-check && pnpm run single-point-check:test
      - name: Tool boundary check
        run: pnpm run tool-boundary-check && pnpm run tool-boundary-check:test
      - name: Artifact check
        run: pnpm run artifact-check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test

      # The CI scenario for `purix check --strict` (purix lock, then a fresh checkout with no local store). A release
      # must not go out if the committed-lock path that CI depends on is broken.
      - name: CI lock flow
        run: pnpm run build && pnpm run ci-lock-flow
      - name: Hook flow
        run: pnpm run ci-hook-flow
      - name: Bypass flow (hooks installed block a direct edit; uninstalled, check --strict names it)
        run: pnpm run ci-bypass-flow
      - name: Connect harness (every supported agent's config starts a server that answers)
        run: pnpm run connect-harness

      # Same two gates ci.yml enforces (the coverage threshold job and the language
      # conformance job). A tag push skips PR review, so publishing must not be able to
      # succeed while either of them would fail on a pull request.
      - name: Coverage gate
        run: pnpm run coverage
      - name: Language conformance suite
        run: node scripts/hide-sandbox-tools.mjs pnpm exec tsx packages/core/src/language/conformance/run.ts

      # A prerelease (0.2.0-beta.0) must never take npm's default "latest" tag: pnpm/npm
      # publish to "latest" unless told otherwise, so `npm install @purix/cli` would hand
      # everyone the beta. Derive the tag from the version: 0.2.0-beta.0 -> beta,
      # 0.3.0-rc.1 -> rc, an unrecognised prerelease -> next, a stable version -> latest.
      - name: Compute npm dist-tag
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          case "$VERSION" in
            *-*)
              TAG=$(echo "$VERSION" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/')
              case "$TAG" in
                *[!A-Za-z]*|"") TAG=next ;;
              esac
              ;;
            *) TAG=latest ;;
          esac
          echo "Publishing $VERSION under dist-tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # All three packages currently move in lockstep at the same version
      # (see each package.json). Fail loudly rather than publish a package
      # whose package.json version doesn't match the git tag that triggered
      # this — that mismatch means someone forgot to bump a version file, or
      # tagged the wrong commit, and either way this should stop, not guess.
      - name: Verify release version matches package versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            SOURCE="tag $GITHUB_REF_NAME"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            EXPECTED="${INPUT_VERSION#v}"
            SOURCE="manual input '$INPUT_VERSION' on main"
          else
            echo "::error::Publish only runs from a v* tag, or manually from main with the version typed in. Got ${GITHUB_EVENT_NAME} on ${GITHUB_REF}."
            exit 1
          fi
          for pkg in packages/core packages/mcp-server packages/cli; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$EXPECTED" ]; then
              echo "::error::Release version from $SOURCE does not match $pkg/package.json version $PKG_VERSION"
              exit 1
            fi
          done
          echo "Publishing $EXPECTED (from $SOURCE)"

      # Build once, pack once, and publish exactly what was packed. Publishing
      # with `pnpm publish` re-runs prepublishOnly (a second build), so the
      # bytes that shipped were never the bytes that were tested. Here the
      # three tarballs are created a single time, checksummed, installed into
      # an empty directory and smoke-tested, and then those same files are
      # what npm receives. pnpm pack rewrites workspace: ranges to real semver.
      - name: Build and pack tarballs (once)
        run: |
          set -euo pipefail
          pnpm run build
          mkdir -p "$RUNNER_TEMP/tarballs"
          for pkg in core mcp-server cli; do
            pnpm --filter "@purix/$pkg" pack --pack-destination "$RUNNER_TEMP/tarballs"
          done
          (cd "$RUNNER_TEMP/tarballs" && sha256sum *.tgz | tee SHA256SUMS)

      - name: Smoke-test the packed tarballs in an empty directory
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/tarballs/purix-core-*.tgz "$RUNNER_TEMP"/tarballs/purix-mcp-server-*.tgz "$RUNNER_TEMP"/tarballs/purix-cli-*.tgz
          if tar -xzOf "$RUNNER_TEMP"/tarballs/purix-cli-*.tgz package/package.json | grep -q 'workspace:'; then
            echo "::error::packed @purix/cli still contains a workspace: range"; exit 1
          fi
          EXPECTED=$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")
          test "$(npx purix --version)" = "$EXPECTED"
          npx purix --help | grep -q adopt

      - name: Upload tarballs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs/

      # Publish order matters: @purix/core has no internal dependency on the
      # others, @purix/mcp-server depends on @purix/core, and @purix/cli
      # depends on both. Each publish makes the next one resolvable.
      # The checksum is re-verified immediately before each upload.
      - name: Publish tarballs (core -> mcp-server -> cli)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tarballs"
          sha256sum -c SHA256SUMS
          for pkg in core mcp-server cli; do
            npm publish "./purix-$pkg-$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version").tgz" --access public --provenance --loglevel verbose --tag "${{ steps.dist_tag.outputs.tag }}"
          done

  oidc-debug:
    if: ${{ inputs.debug_oidc_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishes nothing. Prints the identity claims GitHub sends to npm (repository, workflow, ref... none are secret)
      # and asks npm's token-exchange endpoint about each package. The token and any returned credential are masked/not printed.
      - name: Show OIDC claims and test npm token exchange
        run: |
          cat > "$RUNNER_TEMP/oidc-debug.mjs" <<'EOF'
          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent("npm:registry.npmjs.org");
          const r = await fetch(url, { headers: { Authorization: "bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          const { value: token } = await r.json();
          console.log("::add-mask::" + token);
          const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
          for (const k of ["iss","aud","sub","repository","repository_owner","repository_id","repository_owner_id","repository_visibility","workflow","workflow_ref","job_workflow_ref","ref","ref_type","event_name","environment","runner_environment"]) {
            console.log(k + ": " + JSON.stringify(claims[k]));
          }
          for (const pkg of ["@purix/core", "@purix/mcp-server", "@purix/cli"]) {
            const u = "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/" + pkg.replace("/", "%2f");
            const res = await fetch(u, { method: "POST", headers: { Authorization: "Bearer " + token } });
            const body = await res.text();
            console.log(pkg + " -> HTTP " + res.status + (res.ok ? " (accepted; response not printed)" : " " + body));
          }
          EOF
          node "$RUNNER_TEMP/oidc-debug.mjs"
